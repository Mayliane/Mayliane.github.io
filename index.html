<style>
:root{
  --bg:#ebebea;--bg0:rgba(235,235,234,0);--ink:#141414;--mute:#666664;--line:#cfcfcd;
  --sh1:rgba(0,0,0,.15);--sh2:rgba(0,0,0,.08);
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121212;--bg0:rgba(18,18,18,0);--ink:#ececea;--mute:#7e7e7c;--line:#2b2b2a;
  --sh1:rgba(0,0,0,.55);--sh2:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- écran d'intro : le personnage pousse le panneau, qui s'ouvre ensuite en deux ---------- */
.loader{position:fixed;inset:0;z-index:200;overflow:hidden;
  --ld-bg:#ffffff;--ld-ink:#141414;--ld-skin:#ffffff;--ld-shirt:#a3a3a1;--ld-red:#d9474f;
  --ld-font:"Gloock","Georgia","Times New Roman",serif;
  --ld-fs:min(11.2vw,30vh);--ld-fig:calc(var(--ld-fs)*1.6)}
:root[data-theme="dark"] .loader{--ld-bg:#161616;--ld-ink:#f1f1ef;--ld-skin:#262625;--ld-shirt:#58584f}
.loader.open{pointer-events:none}
.loader.gone{display:none}
.loader.fade{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility .5s}
.ld-back{position:absolute;inset:0;background:#000;transition:opacity .12s linear}
.loader.open .ld-back{opacity:0}
.ld-panels{position:absolute;inset:0;clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0)}
.ld-half{position:absolute;left:0;right:0;height:50%;background:var(--ld-bg);overflow:hidden;will-change:transform}
.ld-top{top:0}.ld-bot{bottom:0}
.ld-line{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-family:var(--ld-font);font-weight:400;
  font-size:var(--ld-fs);line-height:.8;letter-spacing:-.01em;text-transform:uppercase;color:var(--ld-red);opacity:0;transition:opacity .2s}
.loader.fontok .ld-line{opacity:1}
.ld-top .ld-line{bottom:1vh}
.ld-bot .ld-line{top:1vh}
.ld-count{position:absolute;left:calc(22px + var(--sl));bottom:calc(18px + var(--sb));font-weight:600;font-size:13px;letter-spacing:.04em;
  color:var(--ld-ink);font-variant-numeric:tabular-nums;transition:opacity .3s}
.ld-count.off{display:none}
.loader.open .ld-count{opacity:0}
/* ouverture : la ligne du haut monte, celle du bas descend */
.loader.open .ld-top{transform:translate3d(0,-101%,0);transition:transform .85s cubic-bezier(.76,0,.24,1)}
.loader.open .ld-bot{transform:translate3d(0,101%,0);transition:transform .85s cubic-bezier(.76,0,.24,1) .14s}
/* personnage */
.ld-fig{position:absolute;left:0;top:50%;height:var(--ld-fig);width:calc(var(--ld-fig)*200/330);margin-top:calc(var(--ld-fig)/-2);
  opacity:0;pointer-events:none;will-change:transform}
.ld-fig svg,.ld-fig img{display:block;width:100%;height:100%;object-fit:contain;overflow:visible}
.ld-fig .f-skin{fill:var(--ld-skin)}
.ld-fig .f-cap{fill:var(--ld-shirt)}
.ld-fig .f-shirt{fill:url(#ldFlower)}
.ld-fig .f-ink{fill:var(--ld-ink)}
.ld-fig .s-ink{stroke:var(--ld-ink)}
.ld-fig .s-skin{stroke:var(--ld-skin)}
.ld-fig .lg-a,.ld-fig .lg-b{transform-box:view-box}
.ld-fig .lg-a{transform-origin:90px 206px;animation:ldLegA .5s ease-in-out infinite alternate}
.ld-fig .lg-b{transform-origin:98px 208px;animation:ldLegB .5s ease-in-out infinite alternate}
@keyframes ldLegA{from{transform:rotate(-9deg)}to{transform:rotate(13deg)}}
@keyframes ldLegB{from{transform:rotate(12deg)}to{transform:rotate(-10deg)}}

/* après l'arrivée des cartes, les textes apparaissent en passant du flou au net */
.meta,.counter,.list{transition:opacity 1s ease,filter 1s ease}
.counter{transition-delay:0s}.meta{transition-delay:.15s}.list{transition-delay:.3s}
body:not(.ui) :is(.meta,.counter,.list){opacity:0;filter:blur(12px)}
body.ui :is(.meta,.counter,.list){opacity:1;filter:none}

/* ---------- nom vertical + menu ---------- */
.brand{position:fixed;left:calc(22px + var(--sl));top:calc(22px + var(--st));writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:32px;line-height:1;z-index:10;text-transform:uppercase}
.nav{position:fixed;left:16vw;top:calc(26px + var(--st));z-index:10}
.nav small{display:block;color:var(--mute);margin-bottom:34px}
.nav button{display:block;font-weight:700;font-size:34px;line-height:.92;text-transform:uppercase}
.nav button[aria-current=true]::before{content:"—";margin-right:10px;font-weight:400}

/* ---------- bouton mode sombre ---------- */
.themebtn{position:fixed;right:calc(22px + var(--sr));top:calc(22px + var(--st));z-index:10;width:34px;height:34px;display:grid;place-items:center}
.themebtn svg{width:22px;height:22px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"] .themebtn svg{transform:rotate(180deg)}

/* ---------- infos à gauche (ordinateur) ---------- */
.meta{position:fixed;left:calc(4vw + 8px);top:36vh;width:20vw;z-index:10;display:grid;grid-template-columns:5.5em 1fr;gap:18px 14px;font-weight:600}
.meta dt{color:var(--mute);font-weight:500}
.meta dd{max-width:30ch}

/* ---------- scène 3D ---------- */
.stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 50%;overflow:hidden;pointer-events:none}
.card{position:absolute;left:50%;top:50%;width:min(30vw,500px);aspect-ratio:16/9;overflow:hidden;background:var(--line);border-radius:2px;
  box-shadow:0 28px 70px var(--sh1),0 2px 8px var(--sh2);transform-style:preserve-3d;will-change:transform,opacity;pointer-events:auto;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s cubic-bezier(.23,1,.32,1);-webkit-user-drag:none}
@media(hover:hover) and (pointer:fine){.card:hover img{transform:scale(1.04)}}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.1),transparent 38%,rgba(0,0,0,.08));pointer-events:none}

/* ---------- numéro + indices ---------- */
.counter{position:fixed;left:16vw;bottom:calc(3vh + var(--sb));z-index:10;display:flex;align-items:flex-start;gap:14px;line-height:.8;pointer-events:none}
.counter b{font-weight:300;font-size:clamp(120px,27vh,300px);letter-spacing:-.05em}
.counter span{font-weight:600;margin-top:1.1em}
.hint{position:fixed;left:calc(4vw + 8px);bottom:calc(26px + var(--sb));color:var(--mute);z-index:10;pointer-events:none}
.hint .m{display:none}

/* ---------- liste de droite ---------- */
.list{position:fixed;right:0;top:0;bottom:0;width:30vw;z-index:9;pointer-events:none}
.item{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:center;pointer-events:none;will-change:transform,opacity}
.item button{width:100%;max-width:340px;text-align:center;padding:0 12px;pointer-events:auto;transform:translateY(-50%)}
.item .cat{display:block;color:var(--mute);margin-bottom:10px}
.item .ttl{display:block;font-weight:600;font-size:clamp(22px,2.3vw,36px);text-transform:uppercase;line-height:1.05}
.item button{position:relative}
.item .bar{position:absolute;left:50%;top:calc(100% + 16px);display:block;width:18px;height:1px;margin-left:-9px;background:currentColor}
.item .dsc{position:absolute;left:0;right:0;top:calc(100% + 33px);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;line-clamp:5;overflow:hidden;width:max-content;max-width:34ch;margin:0 auto}

/* ---------- à propos / contact ---------- */
.panel{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;padding:calc(26px + var(--st)) calc(22px + var(--sr)) calc(26px + var(--sb)) calc(22px + var(--sl));overflow:auto;touch-action:pan-y}
.panel.open{display:block}
.panel .in{margin-left:16vw;max-width:640px;padding-top:6px}
.panel h2{font-size:clamp(48px,9vw,120px);text-transform:uppercase;line-height:.9;margin-bottom:40px}
.panel p{font-size:18px;line-height:1.4;margin-bottom:18px;max-width:46ch}
.panel .close{position:fixed;right:calc(22px + var(--sr));top:calc(26px + var(--st));text-transform:uppercase;font-weight:600;padding:8px}
.panel .legal{font-size:13px;color:var(--mute);margin-top:64px;line-height:1.6}
.panel .legal a{text-underline-offset:3px}

/* =================== TÉLÉPHONE / TABLETTE PORTRAIT =================== */
@media(max-width:860px){
  .brand{font-size:19px;left:calc(14px + var(--sl));top:calc(16px + var(--st))}
  .nav{left:calc(48px + var(--sl));top:calc(16px + var(--st))}
  .nav small{display:none}
  .nav button{display:inline-block;font-size:15px;line-height:1;margin:0 16px 0 0;padding:8px 0;letter-spacing:.01em}
  .nav button[aria-current=true]::before{content:none}
  .nav button[aria-current=true]{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
  .themebtn{right:calc(10px + var(--sr));top:calc(11px + var(--st))}
  .loader{--ld-fs:min(14.6vw,26vh)}
  .meta{display:none}
  .card{width:72vw;max-width:520px}
  .list{left:0;width:100%;right:auto}
  .item{top:76%}
  .item button{max-width:84vw}
  .item .ttl{font-size:27px}
  .item .dsc{font-size:14px;max-width:32ch;-webkit-line-clamp:3;line-clamp:3}
  .counter{left:calc(18px + var(--sl));bottom:calc(14px + var(--sb))}
  .counter b{font-size:88px}
  .counter span{margin-top:.9em}
  .hint{left:auto;right:calc(18px + var(--sr));bottom:calc(20px + var(--sb));text-align:right;max-width:34vw}
  .hint .d{display:none}.hint .m{display:inline}

  .panel .in{margin-left:0;padding-top:50px}
  .panel h2{font-size:clamp(44px,15vw,80px);margin-bottom:28px}
  .panel p{font-size:17px}
  .panel .legal{font-size:13px;margin-top:48px}
}
/* téléphone en paysage : peu de hauteur */
@media(max-height:520px){
  .nav small{display:none}
  .nav button{font-size:18px;margin:0 0 4px}
  .counter b{font-size:84px}
  .meta{top:32vh}
  .item .ttl{font-size:20px}
  .item .dsc,.item .bar{display:none}
}
@media(hover:none){.card:hover img{transform:none}}


/* ---------- base sobre + verrouillage du thème dans UK 70 ---------- */
:root.uk .themebtn{
  opacity:.35;
  pointer-events:none;
  cursor:not-allowed;
}
@media(max-width:860px){
  .themebtn{width:32px;height:32px}
  .themebtn svg{width:20px;height:20px}
  .card{box-shadow:0 18px 45px var(--sh1),0 2px 7px var(--sh2)}
  .item button{padding-left:18px;padding-right:18px}
}
/* Accès aux modes */
.mode-switch{position:fixed;top:calc(14px + var(--st));right:calc(64px + var(--sr));z-index:30;display:flex;align-items:center;gap:12px}
.mode-switch > button{position:static!important;display:inline-flex!important;visibility:visible!important;opacity:1!important;align-items:center;justify-content:center;cursor:pointer}
.mode-switch .may-btn{font-family:"Permanent Marker","Marker Felt",cursive;font-size:18px;line-height:1;padding:8px 15px 5px;background:#ff3c8e;color:#0b0b0b;border:3px solid #0b0b0b;border-radius:40px;box-shadow:4px 4px 0 #0b0b0b;transform:rotate(-4deg)}
.mode-switch .uk-btn{font-family:"Permanent Marker","Marker Felt",cursive;font-size:18px;line-height:1;padding:8px 14px 5px;background:#0b0b0b;color:#efece3;border:3px solid #0b0b0b;border-radius:0;box-shadow:4px 4px 0 #ff2d8a;transform:rotate(3deg)}
.mode-switch .may-btn:hover,.mode-switch .uk-btn:hover{transform:rotate(0deg) scale(1.06)}
.mode-switch .uk-btn[aria-pressed="true"]{background:#ff3c8e;color:#0b0b0b;box-shadow:4px 4px 0 #0b0b0b}
@media(max-width:860px){.mode-switch{top:calc(50px + var(--st));right:calc(8px + var(--sr));gap:7px}.mode-switch .may-btn,.mode-switch .uk-btn{font-size:15px;padding:6px 10px 3px}}
/* ---------- transition entre l'accueil et les pages projet ---------- */
.wipe{position:fixed;inset:0;z-index:300;background:var(--bg);transform:translateY(100%);pointer-events:none}
/* ---------- ajouts : mobile natif + accessibilité ---------- */
button,a,[role="button"]{touch-action:manipulation}
.card img{-webkit-touch-callout:none}
.card:active,.item button:active,.nav button:active,.themebtn:active,.modal-close:active{transform:scale(.97);transition:transform .12s cubic-bezier(.23,1,.32,1)}
.item button:active{transform:translateY(-50%) scale(.97)}
/* zone de toucher de 44px minimum sans changer l'apparence */
.themebtn::after{content:"";position:absolute;inset:-6px}
.nav button{position:relative}
.nav button::after{content:"";position:absolute;inset:-6px -4px}
/* mouvement réduit : on garde les fondus, on retire les déplacements */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card:hover img,.card:active{transform:none!important}
}
</style>

</head>

<script>
/* =====================================================================
   À MODIFIER
   ===================================================================== */
const CONFIG = {
  name: "Mayliane Lefebvre",
  email: "lefebvremayliane@gmail.com",
  about: "Portfolio de projets de communication réalisés par ma personne.",
  host: "Github",             // contact : hébergeur affiché dans la ligne de mentions légales
  introLines: ["Mayliane", "Lefebvre"],   // intro : les 2 lignes du nom (vide = le nom est coupé automatiquement)
  introColor: "#d9474f",                  // intro : couleur du nom
  introFigure: "",                        // intro : "" = petit personnage intégré ; ou ton dessin : "mon-perso.svg" / ".png" (tourné vers la droite, mains au bord droit)
  introCounter: true                      // intro : petit compteur % en bas à gauche (false = caché)
};

/* Dossier des fichiers (images, vidéos). "" = même dossier que index.html. Exemple : "images/" */
const IMG_DIR = "";

/* ---------------------------------------------------------------------
   PROJETS  (l'ordre ci-dessous = l'ordre dans le carrousel)

   Un clic sur un projet ouvre sa page : projet/<slug>.html (ex. projet/air-up.html),
   placée dans le dossier « projet » à côté de index.html.

   IMAGES : chaque projet a un champ  cover  qui indique son image de couverture.
   Numérotation de tes fichiers :
     01 carte d'infidélité · 02 mariage franco-japonais · 03 Grain Doré boulangerie · 04 Maison Lima
     05 persona Cocon d'Éveil · 06 gourde Air Up · 07 Le Grain Doré · 08 Muddy Bites
     09 Éclat (agence de communication) · 10 Pastelie · 11 Cartier · 12 Horizon Com (doré)
     13 Horizon Com (blanc) · 14 Avenix · 15 Papeterie Neveu

   Champs d'un projet :
     title   : titre
     type    : catégorie
     desc    : courte description
     team    : équipe (laisse "" si aucune)
     cover   : image de couverture, ex. "04.jpg"
     slug    : (optionnel) nom de la page du projet, ex. "air-up" -> air-up.html
               Sans slug, il est créé à partir du titre.
               IMPORTANT : le nom du fichier .html doit correspondre au slug.
     details : (optionnel) lignes d'infos affichées dans la fenêtre, ex. { "Année":"2026", "Outils":"Canva" }
     blocks  : (optionnel) contenu de l'ancienne fenêtre projet (plus utilisée : les pages .html la remplacent).
   --------------------------------------------------------------------- */
const PROJECTS = [
  { title:"Maison Lima", type:"Création d’un produit", team:"", cover:"04.jpg",
    desc:"Nous avons imaginé et lancé Maison Lima, une marque de sacs de voyage à l’apparence de sacs à main. De la conception du produit aux matériaux, en passant par le site internet, les réseaux sociaux, les partenariats, les événements et le lancement, nous avons développé le projet de A à Z.",
    blocks:[] },

  { title:"Cocon d’Éveil", type:"Persona", team:"Léa, Elsa K, Éva, Mayliane", cover:"05.jpg",
    desc:"Étude de persona pour une marque dédiée à l’univers du bébé.",
    blocks:[] },

  { title:"Gourde Air-Up", slug:"air-up", type:"Création de contenu", team:"", cover:"06.jpg",
    desc:"Création d’un spot TV pour mettre en avant la gourde Air Up à travers une campagne publicitaire pensée de la conception à la réalisation.",
    details:{ "Projet":"Pub TV Netflix / streaming", "Cible":"18-30 ans" },
    blocks:[
      { heading:"Concept" },
      { text:"« Ton cerveau pense boire du goût. Il s’est encore fait avoir. »" },
      { heading:"Promesse" },
      { text:"« Boire de l’eau n’a jamais été aussi trompeur. »" },
      { heading:"Objectifs" },
      { text:"Cognitif : faire connaître Air Up comme boisson goût soda sans sucre.\nConatif : inciter à essayer et acheter Air Up.\nAffectif : créer du plaisir et du fun autour du produit." },
      { heading:"Slogan" },
      { text:"« Le soda ? Ton diabète dit non. Air Up dit oui. » Un ton décalé qui fait réagir, tout en restant adapté à la télévision." }
    ] },

  { title:"Le Grain Doré", type:"Identité visuelle", team:"Samuel, Maëlle, Mayliane", cover:"07.jpg",
    desc:"Logo et univers d’une boulangerie artisanale.", blocks:[] },

  { title:"Muddy Bites", type:"Branding", team:"", cover:"08.jpg",
    desc:"Marque de douceurs chocolatées : gaufrettes, glaces et coulants.", blocks:[] },

  { title:"Éclat", type:"Agence de communication", team:"", cover:"09.jpg",
    desc:"Identité d’une agence de communication basée à Paris.", blocks:[] },

  { title:"Pastelie", type:"Identité visuelle", team:"", cover:"10.jpg",
    desc:"Café céramique aux formes douces et aux couleurs pastel.", blocks:[] },

  { title:"Cartier", type:"Projet de marque", team:"Lucie, Arwen, Mayliane, Eva", cover:"11.jpg",
    desc:"Travail autour de l’univers de la maison de joaillerie.", blocks:[] },

  { title:"Horizon Com", type:"Présentation d’agence", team:"", cover:"12.jpg",
    desc:"Notre agence, première version, dans une palette dorée.", blocks:[] },

  { title:"Horizon Com II", type:"Présentation d’agence", team:"", cover:"13.jpg",
    desc:"Seconde version, plus épurée, de la présentation de l’agence.", blocks:[] },

  { title:"Avenix", type:"Identité visuelle", team:"", cover:"14.jpg",
    desc:"Une marque au style graffiti, posée sur un mur de briques.", blocks:[] },

  { title:"Papeterie Neveu", type:"Identité visuelle", team:"", cover:"15.jpg",
    desc:"Papeterie : formes organiques bleu nuit sur fond crème.", blocks:[] },

  { title:"La carte d’infidélité", type:"Lancement d’un concept", cover:"01.jpg",
    team:"Hugues Thimoté, Mayliane Lefebvre, Noah Boutreau, Sixtine Périer Peau, Louna, Tiko, Arwen Vallin",
    desc:"Et si vous trompiez votre bar habituel ? Cette carte ludique invite à découvrir de nouvelles adresses et à sortir de ses habitudes. Grâce à des défis et récompenses, elle transforme la découverte des bars locaux en une expérience fun et conviviale.", blocks:[] },

  { title:"Mariage franco-japonais", type:"Wedding planner", team:"", cover:"02.jpg",
    desc:"Un mariage entre deux cultures. Dans ce projet, nous avons endossé le rôle de wedding planners pour organiser un mariage franco-japonais de A à Z : choix du lieu de réception, repas, activités, DJ, décoration et gestion des différents devis.", blocks:[] },

  { title:"Grain Doré", type:"Identité visuelle", team:"", cover:"03.jpg",
    desc:"Seconde proposition pour la boulangerie, plus éditoriale.", blocks:[] }
];
/* ===================================================================== */

const N = PROJECTS.length;
const $ = id => document.getElementById(id);
const stage = $("stage"), list = $("list");
const imgSrc = i => IMG_DIR + String(i + 1).padStart(2, "0") + ".jpg";
const isRemote = s => /^(https?:)?\/\//i.test(s) || /^(data|blob):/i.test(s);
const asset = s => isRemote(s) ? s : IMG_DIR + s;
const safeUrl = s => (typeof s === "string" && !/^\s*(javascript|data|vbscript):/i.test(s)) ? s : "#";
const coverOf = i => PROJECTS[i].cover ? asset(PROJECTS[i].cover) : imgSrc(i);
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches);
const cards = [], items = [];

/* ---------- adresses des projets (slugs) ---------- */
const slugify = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/[’'`]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const SLUGS = [];
PROJECTS.forEach((p, i) => {
  let base = slugify(p.slug || p.title) || ("projet-" + (i + 1)), s = base, n = 2;
  while (SLUGS.includes(s)) s = base + "-" + n++;
  SLUGS.push(s);
});
const slugIndex = h => {
  let s = String(h || "").replace(/^#\/?/, "");
  try { s = decodeURIComponent(s); } catch (e) {}
  return SLUGS.indexOf(s.toLowerCase());
};
/* adresse de la page d'un projet : projet/<slug>.html */
const pageOf = i => "projet/" + SLUGS[i] + ".html";

/* rideau de transition : monte pour cacher l'accueil, puis la page projet le révèle */
const wipe = document.createElement("div"); wipe.className = "wipe"; document.body.appendChild(wipe);
const WIPE_EASE = "transform .6s cubic-bezier(.76,0,.24,1)";
function go(url, i) {
  if (REDUCED) { location.href = url; return; }
  try { sessionStorage.setItem("lastSlug", SLUGS[i]); } catch (e) {}
  wipe.style.pointerEvents = "auto";
  wipe.style.transition = WIPE_EASE; wipe.style.transform = "none";
  setTimeout(() => { location.href = url; }, 620);
}
/* bouton « précédent » du navigateur : on retire le rideau */
addEventListener("pageshow", e => {
  if (e.persisted) { wipe.style.transition = "none"; wipe.style.transform = "translateY(100%)"; wipe.style.pointerEvents = "none"; }
});

/* ---------- thème clair / sombre ---------- */
const themeBtn = $("themeBtn");
const themeMeta = document.querySelector('meta[name="theme-color"]');
const savedTheme = () => { try { return localStorage.getItem("theme"); } catch (e) { return null; } };
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  if (themeMeta) themeMeta.setAttribute("content", t === "dark" ? "#121212" : "#ebebea");
  themeBtn.setAttribute("aria-label", t === "dark" ? "Passer en mode clair" : "Passer en mode sombre");
}
applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
themeBtn.addEventListener("click", () => {
  if (document.documentElement.classList.contains("uk")) return;
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem("theme", t); } catch (e) {}
});
if (window.matchMedia) {
  const mq = matchMedia("(prefers-color-scheme:dark)");
  const onChange = e => { if (!savedTheme()) applyTheme("dark"); };
  if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
}

/* ---------- construction des cartes ---------- */
for (let i = 0; i < N; i++) {
  const p = PROJECTS[i];

  const c = document.createElement("button");
  c.className = "card";
  c.setAttribute("aria-label", p.title); c.tabIndex = -1;
  const im = document.createElement("img");
  im.src = coverOf(i); im.alt = p.title; im.draggable = false; im.decoding = "async";
  c.appendChild(im);
  c.addEventListener("click", () => activate(i));
  stage.appendChild(c); cards.push(c);

  const it = document.createElement("div");
  it.className = "item"; it.setAttribute("role", "listitem");
  it.innerHTML = '<button><span class="cat"></span><span class="ttl"></span><span class="bar"></span><span class="dsc"></span></button>';
  it.querySelector(".cat").textContent = p.type;
  it.querySelector(".ttl").textContent = p.title;
  it.querySelector(".dsc").textContent = p.desc;
  it.querySelector("button").addEventListener("click", () => activate(i));
  list.appendChild(it); items.push(it);
}
$("tot").textContent = "/" + String(N).padStart(2, "0");

/* ---------- défilement infini ---------- */
let target = 0, cur = 0, shown = -1, raf = null, last = performance.now(), idle = null;
let pointerX = 0, pointerY = 0, ptx = 0, pty = 0;
let ready = false, sweeping = false, sweepT = 0, uiOn = false;   // ready : on peut interagir ; sweeping : les cartes arrivent
const SWEEP_MS = 2300, SWEEP_FROM = 4.5;                          // arrivée rapide des cartes depuis le haut à droite
const wrap = d => ((d + N / 2) % N + N) % N - N / 2;

function nudge(v) {
  if (!ready) return;
  target += v; kick();
  clearTimeout(idle);
  idle = setTimeout(() => { target = Math.round(target); kick(); }, 150);
}
function goTo(i) { const r = Math.round(cur); target = r + wrap(i - r); kick(); }
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }

/* clic : si le projet est au centre -> on ouvre sa page, sinon on le ramène au centre */
let dragged = false;
function activate(i) {
  if (dragged || !ready) return;
  const r = Math.round(cur);
  if (Math.abs(wrap(i - r)) < .01 && Math.abs(target - cur) < .05) go(pageOf(i), i);
  else goTo(i);
}

function render() {
  const mobile = innerWidth <= 860;
  const stepX = innerWidth * (mobile ? .40 : .31);
  const stepY = innerHeight * (mobile ? .15 : .30);
  const yOff  = mobile ? -innerHeight * .07 : 0;
  for (let i = 0; i < N; i++) {
    const d = wrap(i - cur), a = Math.abs(d), c = cards[i], it = items[i];
    if (a > 5) { c.style.visibility = "hidden"; c.style.opacity = 0; it.style.visibility = "hidden"; continue; }
    c.style.visibility = "visible"; it.style.visibility = "visible";

    const center = Math.max(0, 1 - a);
    const x = -d * stepX + ptx * (14 - a * 2);
    const y =  d * stepY + yOff + pty * (12 - a * 1.5);
    const z = -a * 240 + center * 220;
    const scale = .62 + center * (mobile ? .38 : .55) - Math.min(a, 2) * .02;
    const rot = -d * 3.5 + ptx * (a < .7 ? 2.2 : 1);
    const k = a < .7 ? 2 : 1;

    c.style.opacity = Math.max(0, 1 - a * .17);
    c.style.zIndex = 100 - Math.round(a * 10);
    const bl = (!mobile && a > .25) ? Math.round(Math.min(a, 1.5) * 1.1 * 2) / 2 : 0;
    if (c._bl !== bl) { c._bl = bl; c.style.filter = bl ? "blur(" + bl + "px)" : "none"; }
    c.style.transform =
      `translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) rotateZ(${rot}deg) rotateX(${-pty * k}deg) rotateY(${ptx * k}deg) scale(${scale})`;

    it.style.opacity = (mobile ? Math.max(0, 1 - a * 2.4) : Math.max(.02, 1 - a * .55));
    const base = mobile ? 90 : Math.max(innerHeight * .15, 125);
    const ext  = mobile ? 0 : 62;                         // écarte les voisins pour laisser la place à la description du projet actif
    const so = Math.max(0, 1 - a * 2.6);
    const dsc = it._d || (it._d = it.querySelector(".dsc")), bar = it._b || (it._b = it.querySelector(".bar"));
    dsc.style.opacity = so; bar.style.opacity = so;
    if (it._h == null) it._h = dsc.offsetHeight ? dsc.offsetHeight + 33 : 0;        // hauteur de « barre + description », mesurée une fois
    const iy = d * base + Math.sign(d) * Math.min(a, 1) * ext - so * it._h / 2;       // recentre le projet actif comme avant
    it.style.transform = `translate3d(0,${iy}px,0)`;
    it.firstChild.tabIndex = (mobile && a > .5) ? -1 : 0;
    it.firstChild.style.pointerEvents = (mobile && a > .5) ? "none" : "";   // sur mobile, seuls le titre actif est cliquable
  }
  const idx = ((Math.round(cur) % N) + N) % N;
  if (idx !== shown) {
    shown = idx;
    $("num").textContent = String(idx + 1).padStart(2, "0");
    $("m-type").textContent = PROJECTS[idx].type;
    $("m-team").textContent = PROJECTS[idx].team || "—";
    document.title = PROJECTS[idx].title + " – " + CONFIG.name;
  }
}

function tick(now) {
  if (!ready && !sweeping) { raf = null; return; }            // intro en cours : les cartes attendent sous le panneau
  const dt = Math.min(48, now - last); last = now;
  ptx += (pointerX - ptx) * .08; pty += (pointerY - pty) * .08;
  if (sweeping) {
    sweepT = Math.min(1, sweepT + dt / SWEEP_MS);
    const e = 1 - Math.pow(1 - sweepT, 4);                    // départ rapide puis freinage
    cur = target + SWEEP_FROM * (1 - e);
    if (!uiOn && sweepT > .5) { uiOn = true; document.body.classList.add("ui"); }
    if (sweepT >= 1) { sweeping = false; ready = true; cur = target; }
    render(); raf = requestAnimationFrame(tick); return;
  }
  const diff = target - cur;
  const still = Math.abs(diff) < .0007 && Math.abs(pointerX - ptx) < .002 && Math.abs(pointerY - pty) < .002;
  if (still) {
    cur = target; render(); raf = null;
    if (Math.abs(cur) > 1000) { const s = Math.round(cur / N) * N; cur -= s; target -= s; }
    return;
  }
  if (Math.abs(diff) < .0007) cur = target;
  else cur += diff * (1 - Math.pow(.0008, dt / 1000));
  render();
  raf = requestAnimationFrame(tick);
}

/* ---------- entrées ---------- */
const panel = $("panel");
const overlayOpen = () => panel.classList.contains("open");   /* utilisé aussi par mobile.js */

addEventListener("pointermove", e => {
  if (innerWidth <= 860 || e.pointerType === "touch") return;
  pointerX = (e.clientX / innerWidth - .5) * 2;
  pointerY = (e.clientY / innerHeight - .5) * 2;
  kick();
}, { passive: true });
document.addEventListener("mouseleave", () => { pointerX = 0; pointerY = 0; kick(); });

addEventListener("wheel", e => {
  if (overlayOpen()) return;
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
  nudge(Math.max(-1.1, Math.min(1.1, dy / 420)));
}, { passive: false });

/* tactile : glisser = défiler ; un simple appui n'est pas un glissement */
let ty = null, startY = 0;
addEventListener("touchstart", e => {
  dragged = false;
  if (overlayOpen()) { ty = null; return; }
  ty = startY = e.touches[0].clientY;
}, { passive: true });
addEventListener("touchmove", e => {
  if (ty === null) return;
  const y = e.touches[0].clientY;
  if (Math.abs(y - startY) > 9) dragged = true;
  nudge((ty - y) / 240); ty = y;
}, { passive: true });
addEventListener("touchend", () => { ty = null; setTimeout(() => { dragged = false; }, 60); });
addEventListener("touchcancel", () => { ty = null; dragged = false; });

addEventListener("keydown", e => {
  if (panel.classList.contains("open")) { if (e.key === "Escape") closePanel(); return; }
  if (!ready) return;
  if (e.key === " " && e.target.closest && e.target.closest("button,a")) return;   // l'espace active le bouton focalisé
  if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); nudge(1); }
  if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); nudge(-1); }
});
addEventListener("resize", () => { items.forEach(it => { it._h = null; }); render(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { items.forEach(it => { it._h = null; }); render(); });

/* ---------- à propos / contact ---------- */
const pin = $("panel-in");
let opener = null;
function openPanel(k) {
  opener = document.activeElement;
  pin.innerHTML = "";
  const h = document.createElement("h2"); pin.appendChild(h);
  if (k === "about") {
    h.textContent = "À propos";
    const p1 = document.createElement("p"); p1.textContent = CONFIG.about; pin.appendChild(p1);
    const p2 = document.createElement("p"); p2.textContent = N + " projets à découvrir en faisant défiler la page."; pin.appendChild(p2);
  } else {
    h.textContent = "Contact";
    const p1 = document.createElement("p"); p1.textContent = "Pour échanger sur un projet ou une collaboration :"; pin.appendChild(p1);
    const p2 = document.createElement("p"); const a = document.createElement("a");
    a.href = "mailto:" + CONFIG.email; a.textContent = CONFIG.email; p2.appendChild(a); pin.appendChild(p2);

    /* ligne de mentions légales (éditeur, hébergeur, liens vers les pages légales) */
    const p3 = document.createElement("p"); p3.className = "legal";
    p3.appendChild(document.createTextNode(
      "© " + new Date().getFullYear() + " " + CONFIG.name + " · Site édité par " + CONFIG.name +
      ", hébergé par " + CONFIG.host + " · "));
    const l1 = document.createElement("a"); l1.href = "mentions-legales.html"; l1.textContent = "Mentions légales";
    const l2 = document.createElement("a"); l2.href = "cgu.html"; l2.textContent = "CGU";
    p3.append(l1, document.createTextNode(" · "), l2);
    pin.appendChild(p3);
  }
  panel.classList.add("open");
  $("close").focus({ preventScroll: true });
}
function closePanel() {
  panel.classList.remove("open");
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.go === "work"));
  if (opener && opener.focus) opener.focus({ preventScroll: true });
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (!ready) return;
  const k = b.dataset.go;
  if (k === "work") { closePanel(); return; }
  document.querySelectorAll(".nav button").forEach(x => x.setAttribute("aria-current", x === b));
  openPanel(k);
}));
$("close").addEventListener("click", closePanel);

/* ---------- intro : le personnage pousse le panneau, le nom apparaît, puis le panneau s'ouvre en deux ---------- */
const initialIdx = slugIndex(location.hash);
if (initialIdx >= 0) { location.replace(pageOf(initialIdx)); }   // ancien lien index.html#projet -> page du projet
/* retour depuis une page projet : pas d'intro, on revient directement sur le projet quitté */
let skipIntro = false;
try {
  if (sessionStorage.getItem("fromProject") === "1") {
    sessionStorage.removeItem("fromProject"); skipIntro = true;
    const k = SLUGS.indexOf(sessionStorage.getItem("lastSlug")); if (k >= 0) target = k;
  }
} catch (e) {}
cur = target + (skipIntro ? 0 : SWEEP_FROM);                               // les cartes attendent en haut à droite, sous le panneau

const loaderEl = $("loader"), ldPanels = $("ldPanels"), ldFig = $("ldFig"), ldNum = $("ldNum");
const nameParts = String(CONFIG.name || "").trim().split(/\s+/);
const introLines = (CONFIG.introLines && CONFIG.introLines.length) ? CONFIG.introLines : [nameParts[0] || "", nameParts.slice(1).join(" ")];
$("ldL1").textContent = introLines[0] || "";
$("ldL2").textContent = introLines[1] || "";
if (CONFIG.introColor) loaderEl.style.setProperty("--ld-red", CONFIG.introColor);
if (CONFIG.introCounter === false) $("ldCount").classList.add("off");
if (CONFIG.introFigure) {
  ldFig.innerHTML = "";
  const fi = document.createElement("img"); fi.src = asset(CONFIG.introFigure); fi.alt = ""; fi.draggable = false;
  ldFig.appendChild(fi);
}

/* chargement réel des images de couverture */
let loadedCount = 0;
for (let i = 0; i < N; i++) {
  const im = new Image();
  im.onload = im.onerror = () => { loadedCount++; };
  im.src = coverOf(i);
}
setTimeout(() => { loadedCount = N; }, 12000);            // sécurité : on n'attend pas plus de 12 s

const PUSH_MS = REDUCED ? 0 : 2000;     // durée de la poussée : le panneau cède de plus en plus vite
const WALK_MS = 700;                    // le personnage s'en va vers la droite
let SEEN = false; try { SEEN = localStorage.getItem("introSeen") === "1"; localStorage.setItem("introSeen", "1"); } catch (e) {}
const OPEN_AT = REDUCED ? 0 : (SEEN ? 2000 : 3000);   // 2e visite : intro plus courte     // le panneau ne s'ouvre jamais avant (même si tout est déjà chargé)
const easeIn = t => Math.pow(t, 2.3);
let tStart = null, shownPct = 0;

function frame(now) {
  if (tStart === null) tStart = now;
  const el = now - tStart;

  /* le panneau blanc avance, il est poussé par le personnage */
  const p = PUSH_MS ? Math.min(1, el / PUSH_MS) : 1;
  const edge = easeIn(p);
  const clip = "inset(0 " + ((1 - edge) * 100).toFixed(3) + "% 0 0)";
  ldPanels.style.clipPath = clip; ldPanels.style.webkitClipPath = clip;

  /* le personnage : mains au bord du panneau, puis il sort à droite */
  if (!REDUCED) {
    const W = innerWidth, hand = ldFig.offsetWidth * .96;
    let x, bob;
    if (el <= PUSH_MS) { x = edge * W - hand; bob = Math.sin(el / 95) * 2.5 * (1 - edge * .6); }
    else { const q = Math.min(1, (el - PUSH_MS) / WALK_MS); x = W - hand + q * q * (hand + 40); bob = Math.sin(el / 80) * 2; }
    ldFig.style.transform = "translate3d(" + x.toFixed(1) + "px," + bob.toFixed(1) + "px,0)";
  }

  /* compteur : suit le vrai chargement, sans jamais dépasser le temps minimum */
  const real = Math.min(1, loadedCount / N);
  const time = OPEN_AT ? Math.min(1, el / OPEN_AT) : 1;
  const goal = Math.min(real, time) * 100;
  shownPct += (goal - shownPct) * .14;
  if (goal >= 100 && shownPct > 99.4) shownPct = 100;
  ldNum.textContent = String(Math.round(shownPct)).padStart(3, "0");

  if (shownPct >= 100) { setTimeout(openCurtain, 250); return; }
  requestAnimationFrame(frame);
}

/* index.html?p=about ou ?p=contact : ouvre le panneau demandé (liens du menu des pages projet) */
function openFromQuery() {
  const pp = new URLSearchParams(location.search).get("p");
  if (pp === "about" || pp === "contact") {
    document.querySelectorAll(".nav button").forEach(x => x.setAttribute("aria-current", x.dataset.go === pp));
    openPanel(pp);
  }
}

/* retour depuis une page projet : le rideau se lève et révèle directement le carrousel */
function startReturn() {
  loaderEl.classList.add("gone");
  cur = target; ready = true; uiOn = true; document.body.classList.add("ui");
  render(); kick();
  wipe.style.transition = "none"; wipe.style.transform = "none"; void wipe.offsetWidth;
  requestAnimationFrame(() => { wipe.style.transition = WIPE_EASE; wipe.style.transform = "translateY(-100%)"; });
  setTimeout(() => { wipe.style.transition = "none"; wipe.style.transform = "translateY(100%)"; }, 750);
  openFromQuery();
}

function openCurtain() {
  ldFig.style.opacity = 0;
  loaderEl.classList.add(REDUCED ? "fade" : "open");       // la ligne du haut monte, celle du bas descend
  if (REDUCED) { cur = target; ready = true; uiOn = true; document.body.classList.add("ui"); render(); }
  else { sweeping = true; sweepT = 0; }                    // les cartes arrivent en diagonale
  kick();
  openFromQuery();
  setTimeout(() => loaderEl.classList.add("gone"), REDUCED ? 600 : 1300);
}

/* on attend que la police du nom soit prête (1,5 s maximum) avant de lancer la poussée */
if (skipIntro) startReturn(); else Promise.race([
  (document.fonts && document.fonts.load) ? document.fonts.load('1em "Gloock"') : Promise.resolve(),
  new Promise(r => setTimeout(r, 1500))
]).catch(() => {}).then(() => {
  loaderEl.classList.add("fontok");
  ldFig.style.opacity = REDUCED ? 0 : 1;
  requestAnimationFrame(frame);
});

render();
</script>
