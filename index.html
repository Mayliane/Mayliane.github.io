<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayliane Lefebvre – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebebea;--ink:#141414;--mute:#8d8d8b;--line:#cfcfcd;--font:"Archivo","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* nom vertical + menu */
.brand{position:fixed;left:22px;top:22px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:32px;line-height:1;z-index:10;text-transform:uppercase}
.nav{position:fixed;left:16vw;top:26px;z-index:10}
.nav small{display:block;color:var(--mute);margin-bottom:34px}
.nav button{display:block;font-weight:700;font-size:34px;line-height:.92;text-transform:uppercase}
.nav button[aria-current=true]::before{content:"—";margin-right:10px;font-weight:400}

/* infos à gauche */
.meta{position:fixed;left:calc(4vw + 8px);top:36vh;width:20vw;z-index:10;display:grid;grid-template-columns:5.5em 1fr;gap:18px 14px;font-weight:600}
.meta dt{color:var(--mute);font-weight:500}
.meta dd{max-width:30ch}

/* scène 3D */
.stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 50%;overflow:hidden;pointer-events:none}
.card{position:absolute;left:50%;top:50%;width:min(30vw,500px);aspect-ratio:16/9;overflow:hidden;background:var(--line);border-radius:2px;
  box-shadow:0 28px 70px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.08);transform-style:preserve-3d;will-change:transform,opacity;pointer-events:auto;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.card:hover img{transform:scale(1.04)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.1),transparent 38%,rgba(0,0,0,.08));pointer-events:none}

/* numéro */
.counter{position:fixed;left:16vw;bottom:3vh;z-index:10;display:flex;align-items:flex-start;gap:14px;line-height:.8;pointer-events:none}
.counter b{font-weight:300;font-size:clamp(120px,27vh,300px);letter-spacing:-.05em}
.counter span{font-weight:600;margin-top:1.1em}
.hint{position:fixed;left:calc(4vw + 8px);bottom:26px;color:var(--mute);z-index:10}

/* liste de droite */
.list{position:fixed;right:0;top:0;bottom:0;width:30vw;z-index:9;pointer-events:none}
.item{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:center;pointer-events:none;will-change:transform,opacity}
.item button{width:100%;max-width:340px;text-align:center;padding:0 12px;pointer-events:auto;transform:translateY(-50%)}
.item .cat{display:block;color:var(--mute);margin-bottom:10px}
.item .ttl{display:block;font-weight:600;font-size:clamp(22px,2.3vw,36px);text-transform:uppercase;line-height:1}
.item .bar{display:block;width:18px;height:1px;background:currentColor;margin:16px auto}
.item .dsc{display:block;max-width:34ch;margin:auto}

/* fiche projet (clic sur une image) */
.project-modal{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:6vh 7vw;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility .45s}
.project-modal.open{opacity:1;visibility:visible;pointer-events:auto}
.modal-inner{width:min(1180px,100%);height:min(82vh,760px);display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:5vw;align-items:center;transform:translateY(35px) scale(.97);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.project-modal.open .modal-inner{transform:none}
.modal-image{width:100%;height:100%;object-fit:contain;max-height:76vh}
.modal-copy{border-left:1px solid var(--line);padding-left:3vw}
.modal-number{color:var(--mute);font-size:13px;margin-bottom:20px}
.modal-type{color:var(--mute);margin-bottom:12px}
.modal-title{font-size:clamp(38px,5vw,76px);line-height:.9;text-transform:uppercase;letter-spacing:-.04em;margin-bottom:26px}
.modal-desc{font-size:17px;line-height:1.45;max-width:35ch;margin-bottom:28px}
.modal-team{color:var(--mute);line-height:1.4}
.modal-close{position:absolute;right:28px;top:26px;text-transform:uppercase;font-weight:600}
.modal-nav{display:flex;gap:18px;margin-top:30px}
.modal-nav button{color:var(--mute)}
.modal-nav button:hover{color:var(--ink)}

/* à propos / contact */
.panel{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;padding:26px 22px;overflow:auto;touch-action:pan-y}
.panel.open{display:block}
.panel .in{margin-left:16vw;max-width:640px;padding-top:6px}
.panel h2{font-size:clamp(48px,9vw,120px);text-transform:uppercase;line-height:.9;margin-bottom:40px}
.panel p{font-size:18px;line-height:1.4;margin-bottom:18px;max-width:46ch}
.panel .close{position:fixed;right:22px;top:26px}

@media(max-width:860px){
  .brand{font-size:22px;left:14px;top:16px}
  .nav{left:56px;top:18px}
  .nav small{display:none}
  .nav button{font-size:24px}
  .meta{display:none}
  .card{width:72vw}
  .list{left:0;width:100%;right:auto}
  .item{top:73%}
  .item button{max-width:78vw}
  .item .ttl{font-size:26px}
  .counter{left:56px;bottom:14px}
  .counter b{font-size:96px}
  .hint{display:none}
  .modal-inner{height:auto;display:flex;flex-direction:column;gap:24px;align-items:stretch;justify-content:center}
  .modal-image{height:48vh;max-height:none}
  .modal-copy{border-left:0;border-top:1px solid var(--line);padding:22px 0 0}
  .modal-title{font-size:42px}
  .modal-desc{font-size:15px}
  .modal-close{right:18px;top:18px}
  .panel .in{margin-left:34px}
}
</style>
</head>
<body>

<div class="brand">Mayliane Lefebvre ©</div>

<nav class="nav" aria-label="Navigation">
  <small>Menu</small>
  <button data-go="work" aria-current="true">Travaux</button>
  <button data-go="about">À propos</button>
  <button data-go="contact">Contact</button>
</nav>

<dl class="meta"><dt>Type</dt><dd id="m-type"></dd><dt>Équipe</dt><dd id="m-team"></dd></dl>

<div class="stage" id="stage"></div>

<div class="counter"><b id="num">01</b><span id="tot">/15</span></div>
<div class="hint">Défiler</div>

<div class="list" id="list" role="list" aria-label="Projets"></div>

<section class="project-modal" id="projectModal" role="dialog" aria-modal="true" aria-label="Projet">
  <button class="modal-close" id="modalClose">Fermer ×</button>
  <div class="modal-inner">
    <img class="modal-image" id="modalImage" alt="">
    <div class="modal-copy">
      <div class="modal-number" id="modalNumber"></div>
      <div class="modal-type" id="modalType"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-team" id="modalTeam"></div>
      <div class="modal-nav"><button id="prevProject">← précédent</button><button id="nextProject">suivant →</button></div>
    </div>
  </div>
</section>

<section class="panel" id="panel"><button class="close" id="close">Fermer</button><div class="in" id="panel-in"></div></section>

<script>
/* ============ À MODIFIER ============ */
const CONFIG = {
  name: "Mayliane Lefebvre",
  email: "prenom.nom@mail.com",
  about: "Portfolio de projets de communication réalisés en équipe : identités visuelles, personas, stratégies publicitaires, événementiel et supports de marque."
};

/* Ordre = ordre des images : le projet n°1 utilise 01.jpg, le n°2 utilise 02.jpg, etc.
   Format : [titre, type, description, équipe] */
const PROJECTS = [
  ["Maison Lima","Identité de marque","Marque de denim. « Quand l’art rencontre l’indispensable ».","—"],
  ["Cocon d’Éveil","Persona","Étude de persona pour une marque dédiée à l’univers du bébé.","Léa, Elsa K, Éva, Mayliane"],
  ["Air Up","Stratégie publicitaire","Création de contenu et réalisation d’un spot TV.","—"],
  ["Le Grain Doré","Identité visuelle","Logo et univers d’une boulangerie artisanale.","Samuel, Maëlle, Mayliane"],
  ["Muddy Bites","Branding","Marque de douceurs chocolatées : gaufrettes, glaces et coulants.","—"],
  ["Éclat","Agence de communication","Identité d’une agence de communication basée à Paris.","—"],
  ["Pastelie","Identité visuelle","Café céramique aux formes douces et aux couleurs pastel.","—"],
  ["Cartier","Projet de marque","Travail autour de l’univers de la maison de joaillerie.","Lucie, Arwen, Mayliane, Eva"],
  ["Horizon Com","Présentation d’agence","Notre agence, première version, dans une palette dorée.","—"],
  ["Horizon Com II","Présentation d’agence","Seconde version, plus épurée, de la présentation de l’agence.","—"],
  ["Avenix","Identité visuelle","Une marque au style graffiti, posée sur un mur de briques.","—"],
  ["Papeterie Neveu","Identité visuelle","Papeterie : formes organiques bleu nuit sur fond crème.","—"],
  ["Carte d’infidélité","Programme de fidélité","Conception d’une carte de fidélité et de son univers visuel.","Hugues Thimoté, Mayliane Lefebvre, Noah Boutreau, Sixtine Périer Peau, Louna, Tiko, Arwen Vallin"],
  ["Mariage franco-japonais","Événementiel","Organisation d’un mariage entre deux cultures : devis, activités, DJ, repas et lieu de réception.","—"],
  ["Grain Doré","Identité visuelle","Seconde proposition pour la boulangerie, plus éditoriale.","—"]
];
/* Si tes images sont dans un dossier, mets "images/" ici */
const IMG_DIR = "";
/* ================================== */

const N = PROJECTS.length;
const $ = id => document.getElementById(id);
const stage = $("stage"), list = $("list");
const imgSrc = i => IMG_DIR + String(i + 1).padStart(2, "0") + ".jpg";
const cards = [], items = [];

for (let i = 0; i < N; i++) {
  const [title, type, desc] = PROJECTS[i];

  const c = document.createElement("button");
  c.className = "card";
  c.setAttribute("aria-label", "Ouvrir " + title);
  const im = document.createElement("img");
  im.src = imgSrc(i); im.alt = title; im.draggable = false;
  c.appendChild(im);
  c.addEventListener("click", () => openProject(i));
  stage.appendChild(c); cards.push(c);

  const it = document.createElement("div");
  it.className = "item";
  it.setAttribute("role", "listitem");
  it.innerHTML = '<button><span class="cat"></span><span class="ttl"></span><span class="bar"></span><span class="dsc"></span></button>';
  it.querySelector(".cat").textContent = type;
  it.querySelector(".ttl").textContent = title;
  it.querySelector(".dsc").textContent = desc;
  it.querySelector("button").addEventListener("click", () => openProject(i));
  list.appendChild(it); items.push(it);
}
$("tot").textContent = "/" + String(N).padStart(2, "0");

/* ---------- défilement INFINI ---------- */
let target = 0, cur = 0, shown = -1, raf = null, last = performance.now(), idle = null;
let pointerX = 0, pointerY = 0, ptx = 0, pty = 0;
const wrap = d => ((d + N / 2) % N + N) % N - N / 2;   // ramène la distance entre -N/2 et +N/2

function nudge(v) {
  target += v;                                           // plus de limite : on tourne en boucle
  kick();
  clearTimeout(idle);
  idle = setTimeout(() => { target = Math.round(target); kick(); }, 150);
}
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }

function render() {
  const mobile = innerWidth <= 860;
  for (let i = 0; i < N; i++) {
    const d = wrap(i - cur), a = Math.abs(d), c = cards[i], it = items[i];
    if (a > 5) { c.style.visibility = "hidden"; c.style.opacity = 0; it.style.visibility = "hidden"; continue; }
    c.style.visibility = "visible"; it.style.visibility = "visible";

    const center = Math.max(0, 1 - a);
    const stepX = innerWidth * (mobile ? .30 : .31);
    const stepY = innerHeight * .30;
    const x = -d * stepX + ptx * (14 - a * 2);
    const y =  d * stepY + pty * (12 - a * 1.5);
    const z = -a * 240 + center * 220;
    const scale = .62 + center * (mobile ? .38 : .55) - Math.min(a, 2) * .02;
    const rot = -d * 3.5 + ptx * (a < .7 ? 2.2 : 1);
    const k = a < .7 ? 2 : 1;

    c.style.opacity = Math.max(0, 1 - a * .17);
    c.style.zIndex = 100 - Math.round(a * 10);
    c.style.filter = a > .25 ? "blur(" + (Math.min(a, 1.5) * 1.1).toFixed(2) + "px)" : "none";   // flou léger sur les voisins, image active nette
    c.style.transform =
      `translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) rotateZ(${rot}deg) rotateX(${-pty * k}deg) rotateY(${ptx * k}deg) scale(${scale})`;

    it.style.opacity = mobile ? Math.max(0, 1 - a * 1.8) : Math.max(.02, 1 - a * .55);
    it.style.transform = `translate3d(0,${d * (mobile ? 55 : innerHeight * .17)}px,0)`;
    const so = Math.max(0, 1 - a * 2.6);               // description visible seulement sur le projet actif
    it.querySelector(".dsc").style.opacity = so;
    it.querySelector(".bar").style.opacity = so;
  }
  const idx = ((Math.round(cur) % N) + N) % N;
  if (idx !== shown) {
    shown = idx;
    $("num").textContent = String(idx + 1).padStart(2, "0");
    $("m-type").textContent = PROJECTS[idx][1];
    $("m-team").textContent = PROJECTS[idx][3];
    document.title = PROJECTS[idx][0] + " – " + CONFIG.name;
  }
}

function tick(now) {
  const dt = Math.min(48, now - last); last = now;
  ptx += (pointerX - ptx) * .08; pty += (pointerY - pty) * .08;
  const diff = target - cur;
  const still = Math.abs(diff) < .0007 && Math.abs(pointerX - ptx) < .002 && Math.abs(pointerY - pty) < .002;
  if (still) {
    cur = target; render(); raf = null;
    if (Math.abs(cur) > 1000) { const s = Math.round(cur / N) * N; cur -= s; target -= s; }
    return;
  }
  if (Math.abs(diff) < .0007) cur = target;
  else cur += diff * (1 - Math.pow(.0008, dt / 1000));
  render();
  raf = requestAnimationFrame(tick);
}

/* ---------- entrées ---------- */
const modal = $("projectModal"), panel = $("panel");
const overlayOpen = () => modal.classList.contains("open") || panel.classList.contains("open");

addEventListener("pointermove", e => {
  if (innerWidth <= 860 || e.pointerType === "touch") return;
  pointerX = (e.clientX / innerWidth - .5) * 2;
  pointerY = (e.clientY / innerHeight - .5) * 2;
  kick();
}, { passive: true });
document.addEventListener("mouseleave", () => { pointerX = 0; pointerY = 0; kick(); });

addEventListener("wheel", e => {
  if (overlayOpen()) return;
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
  nudge(Math.max(-1.1, Math.min(1.1, dy / 420)));
}, { passive: false });

let ty = null;
addEventListener("touchstart", e => { if (!overlayOpen()) ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchmove", e => {
  if (ty === null) return;
  const y = e.touches[0].clientY; nudge((ty - y) / 260); ty = y;
}, { passive: true });
addEventListener("touchend", () => { ty = null; });

addEventListener("keydown", e => {
  if (modal.classList.contains("open")) {
    if (e.key === "Escape") closeProject();
    if (e.key === "ArrowRight") openProject((currentProject + 1) % N);
    if (e.key === "ArrowLeft") openProject((currentProject - 1 + N) % N);
    return;
  }
  if (panel.classList.contains("open")) { if (e.key === "Escape") closePanel(); return; }
  if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); nudge(1); }
  if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); nudge(-1); }
});
addEventListener("resize", render);

/* ---------- fiche projet ---------- */
const modalImage = $("modalImage");
let currentProject = 0, previousFocus = null;
function openProject(i) {
  if (!modal.classList.contains("open")) previousFocus = document.activeElement;
  currentProject = i;
  const p = PROJECTS[i];
  modalImage.src = imgSrc(i); modalImage.alt = p[0];
  $("modalNumber").textContent = String(i + 1).padStart(2, "0") + " / " + String(N).padStart(2, "0");
  $("modalType").textContent = p[1];
  $("modalTitle").textContent = p[0];
  $("modalDesc").textContent = p[2];
  $("modalTeam").textContent = p[3] !== "—" ? "Avec " + p[3] : "";
  modal.classList.add("open");
  $("modalClose").focus();
}
function closeProject() {
  modal.classList.remove("open");
  goToCurrent();
  if (previousFocus) previousFocus.focus();
}
function goToCurrent() {            // à la fermeture, la page se cale sur le projet qu'on vient de voir
  const r = Math.round(cur);
  target = r + wrap(currentProject - r);
  kick();
}
$("modalClose").addEventListener("click", closeProject);
$("prevProject").addEventListener("click", () => openProject((currentProject - 1 + N) % N));
$("nextProject").addEventListener("click", () => openProject((currentProject + 1) % N));

/* ---------- à propos / contact ---------- */
const pin = $("panel-in");
let opener = null;
function openPanel(k) {
  opener = document.activeElement;
  pin.innerHTML = "";
  const h = document.createElement("h2"); pin.appendChild(h);
  if (k === "about") {
    h.textContent = "À propos";
    const p1 = document.createElement("p"); p1.textContent = CONFIG.about; pin.appendChild(p1);
    const p2 = document.createElement("p"); p2.textContent = N + " projets à découvrir en faisant défiler la page."; pin.appendChild(p2);
  } else {
    h.textContent = "Contact";
    const p1 = document.createElement("p"); p1.textContent = "Pour échanger sur un projet ou une collaboration :"; pin.appendChild(p1);
    const p2 = document.createElement("p"); const a = document.createElement("a");
    a.href = "mailto:" + CONFIG.email; a.textContent = CONFIG.email; p2.appendChild(a); pin.appendChild(p2);
  }
  panel.classList.add("open");
  $("close").focus();
}
function closePanel() {
  panel.classList.remove("open");
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.go === "work"));
  if (opener) opener.focus();
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.go;
  if (k === "work") { closePanel(); return; }
  document.querySelectorAll(".nav button").forEach(x => x.setAttribute("aria-current", x === b));
  openPanel(k);
}));
$("close").addEventListener("click", closePanel);

render(); kick();
</script>
</body>
</html>
